name: agentic-dba
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2025-latest
    container_name: agentic-dba-sql-database
    labels:
      agentic-dba: demo
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "127.0.0.1:1234:1433"
    volumes:
      - sql-data:/var/opt/mssql
      - ./database.sql:/demo/database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "SQLCMDPASSWORD=\"$$MSSQL_SA_PASSWORD\" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -b -Q 'SELECT 1' > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [demo]
  mcp:
    image: mcr.microsoft.com/azure-databases/data-api-builder:2.1.5
    container_name: agentic-dba-mcp-server
    labels:
      agentic-dba: demo
    environment:
      SQL_CONN_STRING: "Server=sql;Database=McpDbaDemo;User Id=sa;Password=${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env};Encrypt=True;TrustServerCertificate=True;Application Name=McpDbaDemo;Command Timeout=150"
    ports:
      - "127.0.0.1:5678:5000"
    volumes:
      - ./dab-config.json:/App/dab-config.json:ro
    depends_on:
      sql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [demo]
networks:
  demo:
    name: agentic-dba-network
volumes:
  sql-data:
    name: agentic-dba-sql-data
